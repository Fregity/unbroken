<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="6" fill="#0e0e0e"/>

  <!-- 3×3 grid. cell=7px gap=2px. total=3*7+2*2=25. offset=(32-25)/2=3.5 -->
  <!-- Diagonal brightness: top-left darkest, bottom-right brightest -->

  <!-- Row 0 -->
  <rect x="3.5" y="3.5"  width="7" height="7" rx="1.5" fill="#1f3d1f"/>
  <rect x="12.5" y="3.5" width="7" height="7" rx="1.5" fill="#2d5a2d"/>
  <rect x="21.5" y="3.5" width="7" height="7" rx="1.5" fill="#347a34"/>

  <!-- Row 1 -->
  <rect x="3.5"  y="12.5" width="7" height="7" rx="1.5" fill="#2d5a2d"/>
  <rect x="12.5" y="12.5" width="7" height="7" rx="1.5" fill="#347a34"/>
  <rect x="21.5" y="12.5" width="7" height="7" rx="1.5" fill="#3fb950"/>

  <!-- Row 2 -->
  <rect x="3.5"  y="21.5" width="7" height="7" rx="1.5" fill="#347a34"/>
  <rect x="12.5" y="21.5" width="7" height="7" rx="1.5" fill="#3fb950"/>
  <rect x="21.5" y="21.5" width="7" height="7" rx="1.5" fill="#5bf070"/>
</svg>
